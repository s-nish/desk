<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#292929"/>
      <stop offset=".55" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="edge" x2=".7" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="spine" x2="1" y2="1">
      <stop stop-color="#dedede"/>
      <stop offset="1" stop-color="#999999"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#edge)" stroke-width="4"/>
  <!-- Two planes form a D; the open seam is part of the silhouette. -->
  <g transform="translate(182 182) scale(20)">
    <path d="M4 9 9 6v20l-5 3V9Z" fill="url(#spine)"/>
    <path d="M12 4h5a12 12 0 0 1 0 24h-5v-5h5a7 7 0 0 0 0-14h-5V4Z" fill="#f5f5f5"/>
  </g>
</svg>
