<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Solid black tile with a hairline edge so it reads on dark docks too. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#000000" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Terminal window: white outline, title bar rule, three dots. -->
  <rect x="236" y="290" width="552" height="444" rx="56" fill="none" stroke="#ffffff" stroke-width="22"/>
  <path d="M247 386 H777" stroke="#ffffff" stroke-width="14" stroke-opacity="0.35"/>
  <circle cx="306" cy="338" r="14" fill="#ffffff"/>
  <circle cx="352" cy="338" r="14" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="398" cy="338" r="14" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Prompt -->
  <path d="M350 474 L432 548 L350 622" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="478" y="600" width="164" height="44" rx="22" fill="#ffffff"/>
</svg>
