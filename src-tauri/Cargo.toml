[package]
name = "desk"
version = "0.1.0"
edition = "2024"
description = "Desk: terminals, projects and accounts for Claude Code and Codex"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
ignore = "0.4.33"
regex = "1.13.1"
libc = "0.2.191"
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
trash = "5.2.9"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
