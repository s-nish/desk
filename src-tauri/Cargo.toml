[package]
name = "desk"
version = "1.0.0"
edition = "2024"
description = "Desk: terminals, projects and accounts for Claude Code and Codex"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
ignore = "0.4.33"
regex = "1.13.1"
libc = "0.2.191"
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["unstable", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.8.3"
trash = "5.2.9"
sha2 = "0.10.9"
tauri-plugin-notification = "2"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"


[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
